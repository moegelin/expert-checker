/* Layout: phone-width app column (max 480px), sticky top bar, scrolling screen, fixed bottom tabs.
   Screens by hash: #liste, #p-<webcode>, #cashback, #o-<id>, #einstellungen. */
:root{
  --bg:#f2f4f7; --card:#ffffff; --card-2:#f6f7f9; --fg:#1b1f24; --muted:#5f6b7a; --line:#e3e7ec; --line-2:#d0d6de;
  --blue:#1a66d6; --blue-soft:#e8f0fd; --blue-ink:#154f9f;
  --green:#188038; --green-soft:#e4f3e8; --green-ink:#146c2e;
  --amber:#b45f06; --amber-soft:#fdf0d8; --amber-ink:#8f4b00;
  --teal:#0b7285; --teal-soft:#e0f3f6; --teal-ink:#0a5c6b;
  --red:#c5221f; --red-soft:#fde8e6; --red-ink:#a11b18;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Roboto","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(27,31,36,.06),0 2px 8px rgba(27,31,36,.06);
  --r:12px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#121417; --card:#1c2026; --card-2:#232830; --fg:#e9edf2; --muted:#9aa6b4; --line:#2b323b; --line-2:#3a434e;
  --blue:#6ea4f5; --blue-soft:#1b2a44; --blue-ink:#9cc0fa;
  --green:#5dc47a; --green-soft:#17301f; --green-ink:#8ddba1;
  --amber:#f0b04f; --amber-soft:#3a2a10; --amber-ink:#f6c877;
  --teal:#5cc3d6; --teal-soft:#0f2b31; --teal-ink:#8fd8e6;
  --red:#ff8a80; --red-soft:#3d1f1c; --red-ink:#ffa8a0;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121417; --card:#1c2026; --card-2:#232830; --fg:#e9edf2; --muted:#9aa6b4; --line:#2b323b; --line-2:#3a434e;
  --blue:#6ea4f5; --blue-soft:#1b2a44; --blue-ink:#9cc0fa;
  --green:#5dc47a; --green-soft:#17301f; --green-ink:#8ddba1;
  --amber:#f0b04f; --amber-soft:#3a2a10; --amber-ink:#f6c877;
  --teal:#5cc3d6; --teal-soft:#0f2b31; --teal-ink:#8fd8e6;
  --red:#ff8a80; --red-soft:#3d1f1c; --red-ink:#ffa8a0;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--blue-soft);color:var(--fg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:var(--blue-ink);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:560px){ .app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
.muted{color:var(--muted)} .small{font-size:12.5px} .num{font-variant-numeric:tabular-nums}
.hidden{display:none !important}
.thumb{background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;border-radius:8px}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .thumb{background-color:#f3f4f6} }
:root[data-theme="dark"] .thumb{background-color:#f3f4f6}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:54px}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top.detail h1{font-size:16px}
.top .back{width:36px;height:36px;margin-left:-10px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.top .back:hover{background:var(--card-2)}
.top .meta{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;line-height:1.3}
.top .meta b{color:var(--fg);font-weight:500}
.top .meta .warn{color:var(--red)}

/* screen */
.screen{flex:1;padding:12px 16px 96px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:8px 2px -4px}
.sec h2{font-size:13px;font-weight:600;margin:0;color:var(--fg)}
.sec .hint{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line);line-height:1.45}
.note b{color:var(--fg);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:9px;padding:8px 13px;font-size:14px;font-weight:500;background:var(--card);color:var(--fg)}
.btn:hover{background:var(--card-2)}
.btn.primary{background:var(--blue);color:#fff;border-color:transparent}
.btn.primary:hover{background:var(--blue-ink)}
.btn.small{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:500}

/* badges: one shape everywhere */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.4}
.badge svg{width:11px;height:11px}
.b-set{background:var(--teal-soft);color:var(--teal-ink)}
.b-cash{background:var(--amber-soft);color:var(--amber-ink)}
.b-aus{background:var(--red-soft);color:var(--red-ink)}
.b-down{background:var(--green-soft);color:var(--green-ink)}
.b-up{background:var(--red-soft);color:var(--red-ink)}
.b-new{background:var(--blue-soft);color:var(--blue-ink)}
.b-off{background:var(--card-2);color:var(--muted)}
.b-code{background:var(--card-2);color:var(--muted);font-weight:500}

/* ---- watch list ---- */
.prod{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 12px;padding:12px 14px;width:100%;border-top:1px solid var(--line);align-items:start}
.prod:first-child{border-top:0}
.prod:hover{background:var(--card-2)}
.prod .thumb{height:70px;grid-row:1 / span 2}
.prod .name{font-weight:600;font-size:15px;line-height:1.3;text-wrap:balance}
.prod .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.prices{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pc{border:1px solid transparent;border-radius:9px;padding:7px 10px;min-width:0}
.pc.best{border-color:var(--green);background:var(--green-soft)}
.pc .k{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:4px}
.pc.best .k{color:var(--green-ink)}
.pc .k svg{width:12px;height:12px}
.pc .v{font-size:19px;font-weight:700;line-height:1.15;margin-top:2px;white-space:nowrap}
.pc.best .v{color:var(--green-ink)}
.pc .w{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .w b{font-weight:500;color:var(--fg)}
.pc.none .v{font-size:14px;font-weight:500;color:var(--muted);margin-top:4px}
.badges{grid-column:1 / -1;display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.add{display:flex;gap:8px;align-items:center;padding:12px 14px}
.add input{flex:1;min-width:0;font:inherit;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--card);color:var(--fg)}
.add input::placeholder{color:var(--muted)}

/* ---- product detail ---- */
.hero{padding:14px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 14px;align-items:center}
.hero .thumb{height:92px;grid-row:1 / span 3}
.hero .title{font-size:17px;font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.hero .sub{font-size:12.5px;color:var(--muted)}
.hero .links{font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.tile{border:1px solid transparent;border-radius:10px;padding:10px 12px;min-width:0}
.tile.best{border-color:var(--green);background:var(--green-soft)}
.tile .k{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.tile.best .k{color:var(--green-ink)}
.tile .v{font-size:22px;font-weight:700;line-height:1.15;margin-top:3px;white-space:nowrap}
.tile.best .v{color:var(--green-ink)}
.tile .w{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.tile .w b{font-weight:500;color:var(--fg)}
.alert{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.alert .k{font-weight:500}
.alert .k small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.alert select,.alert input{font:inherit;padding:6px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);color:var(--fg);max-width:160px}
.alert input{width:100px;text-align:right}
.chart{padding:12px 14px 8px}
.chart svg{width:100%;height:auto;display:block}
.chart .leg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.chart .leg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.store{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.store:first-child{border-top:0}
.store.best{background:var(--green-soft)}
.store .n{font-weight:600;font-size:14.5px;line-height:1.3}
.store .n .badge{margin-left:6px;vertical-align:1px}
.store .a{font-size:12.5px;color:var(--muted);line-height:1.4}
.store .a b{color:var(--fg);font-weight:500}

function enrich(p){
  const offers=p.offers.map(o=>({...o,shipped:o.on>0?+(o.p+o.ship+(o.code||0)).toFixed(2):null,pickup:o.st>0?o.p:null,inRange:S[o.s].km!=null&&S[o.s].km<=USER.radius}));
  const ship=offers.filter(o=>o.shipped!=null).sort((a,b)=>a.shipped-b.shipped)[0]||null;
  const pick=offers.filter(o=>o.pickup!=null&&o.inRange).sort((a,b)=>a.pickup-b.pickup)[0]||null;
  const bestKind=!pick?"ship":!ship?"pick":(pick.pickup<=ship.shipped?"pick":"ship");
  const best=bestKind==="pick"?pick.pickup:ship?ship.shipped:null;
  const h=[...p.hist]; const hp=p.histP||[]; const todayBest=Math.min(h[h.length-1],hp[hp.length-1]??Infinity), yBest=Math.min(h[h.length-2],hp[hp.length-2]??Infinity);
  return {...p,offers,ship,pick,bestKind,best,delta:+(todayBest-yBest).toFixed(2),hasAus:offers.some(o=>o.disp&&o.inRange),hasSet:p.sets.length>0};
}

function chart(p){
  const W=420,H=160,L=50,R=10,T=12,B=30; const a=p.hist, b=(p.histP||[]).map(v=>v??null);
  const all=[...a,...b.filter(v=>v!=null),p.target]; let min=Math.min(...all),max=Math.max(...all); const pad=(max-min||100)*.12; min-=pad;max+=pad;
  const x=i=>L+(i/(a.length-1))*(W-L-R), y=v=>T+(1-(v-min)/(max-min))*(H-T-B);
  const path=arr=>{let d="",open=false;arr.forEach((v,i)=>{if(v==null){open=false;return}d+=(open?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)+" ";open=true});return d};
  const ticks=[0,1,2,3].map(k=>{const v=min+pad+(max-min-2*pad)*k/3;return `<text x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-size="13" fill="var(--muted)">${eur0(v).replace(" €","")}</text><line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/>`}).join("");
  const last=i=>{for(let k=i.length-1;k>=0;k--) if(i[k]!=null) return k;return -1};
  const la=a.length-1, lb=last(b);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Preisverlauf 30 Tage">
    ${ticks}
    <line x1="${L}" x2="${W-R}" y1="${y(p.target).toFixed(1)}" y2="${y(p.target).toFixed(1)}" stroke="var(--line-2)" stroke-dasharray="4 3"/>
    <path d="${path(a)} L${x(la).toFixed(1)} ${(H-B).toFixed(1)} L${x(0).toFixed(1)} ${(H-B).toFixed(1)} Z" fill="var(--blue)" opacity=".08"/>
    <path d="${path(a)}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>
    ${lb>=0?`<path d="${path(b)}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(lb).toFixed(1)}" cy="${y(b[lb]).toFixed(1)}" r="3.5" fill="var(--green)"/>`:""}
    <circle cx="${x(la).toFixed(1)}" cy="${y(a[la]).toFixed(1)}" r="3.5" fill="var(--blue)"/>
    <text x="${L}" y="${H-6}" font-size="13" fill="var(--muted)">vor 30 Tagen</text><text x="${W-R}" y="${H-6}" font-size="13" fill="var(--muted)" text-anchor="end">heute</text>
  </svg>`;
}

function renderOffer(id){
  const o=O.find(x=>x.id===id); setTop(o.t,"cashback"); setTabs("cashback");
  const tvRows=o.tvs.map(t=>`<div class="dev ${o.bars.length&&C.tv===t.m?'sel':''}"><div><div class="n">${esc(t.n)}${t.watch?'<span class="badge b-set">beobachtet</span>':''}${t.ex?'<span class="badge b-off">echter Preis</span>':''}</div><div class="s">${esc(t.m)} · ${esc(S[t.s].n.replace("expert ",""))}${S[t.s].km!=null?` · ${S[t.s].km} km`:""}</div></div>
    <div class="a">${eur0(t.a)}${t.d?`<small>${eur0(t.d)} mit Soundbar</small>`:""}</div><div class="pr">${eur0(t.p)}<small>netto ${eur0(t.p-(t.d||t.a))}</small></div>
    ${o.bars.length?`<div class="pick"><button class="btn small" aria-pressed="${C.tv===t.m}" onclick="C.tv='${t.m}';renderOffer('${id}')">Im Rechner</button>${t.watch?"":`<button class="btn small" onclick="toast('Auf die Beobachtungsliste gesetzt')">Beobachten</button>`}</div>`:""}</div>`).join("");
  const barRows=o.bars.map(b=>`<div class="dev ${C.bar===b.m?'sel':''}"><div><div class="n">${esc(b.n)}</div><div class="s">${esc(b.m)} · ${b.p?`${esc(S[b.s].n.replace("expert ",""))}${S[b.s].km!=null?` · ${S[b.s].km} km`:""}`:"bei expert nicht gefunden · per Link ergänzen"}${b.set?`<br><span class="badge b-set">Set mit ${esc(b.set.tv)}: −${b.set.disc} €</span>`:""}</div></div><div></div><div class="pr">${b.p?eur0(b.p):"—"}<small>${b.p?"bester Preis":"kein Preis"}</small></div>
    <div class="pick"><button class="btn small" aria-pressed="${C.bar===b.m}" ${b.p?"":"disabled"} onclick="C.bar='${b.m}';renderOffer('${id}')">Im Rechner</button><button class="btn small" onclick="toast('Auf die Beobachtungsliste gesetzt')">Beobachten</button></div></div>`).join("");
  document.getElementById("screen").innerHTML=`
    <div class="card"><div class="sum"><div class="logo ${o.cls}" aria-hidden="true" style="color:#fff;background:${o.cls==='sony'?'#1b1b1b':'#1428a0'}">${esc(o.brand)}</div><div><div style="font-weight:600">${esc(o.t)}</div><div class="small muted">${o.ended?"beendet am "+o.to:"läuft noch bis "+o.to}</div></div>
      <div class="big"><b>${eur0(o.min).replace(" €","")}–${eur0(o.max)}</b><span class="muted">je TV${o.dbl?`, verdoppelt mit Soundbar (max. ${eur0(o.dbl)})`:(o.pair?", nur TV + Soundgerät zusammen":"")}</span></div></div>
      <dl class="facts"><dt>Kaufen</dt><dd>${o.from} – ${o.to}</dd><dt>Registrieren</dt><dd>${o.regFrom?`${o.regFrom} – `:"bis "}${o.regBy}${o.url?` · <a href="${o.url}" target="_blank" rel="noopener">${esc(o.url.replace(/^https?:\/\/(www\.)?/,""))} ${I.ext}</a>`:""}</dd><dt>Bedingungen</dt><dd>${o.pdf?`<a href="${o.pdf}" target="_blank" rel="noopener">Teilnahmebedingungen (PDF) ${I.ext}</a>`:"—"} <span class="muted small">· ${esc(o.src)}</span></dd></dl>
      <div class="cond">${I.info}<span>${esc(o.rule)}</span></div>
      ${(o.dbl||o.pair)?`<div class="cond">${I.warn}<span>${o.sameInvoice?"TV und Soundbar müssen auf <b>derselben Rechnung</b> stehen. In zwei Märkten gekauft gibt es nur den einfachen Betrag.":"TV und Soundbar dürfen in verschiedenen Märkten und an verschiedenen Tagen gekauft werden."}</span></div>`:""}
      ${o.note?`<div class="note">${esc(o.note)}</div>`:""}</div>
    ${o.tvs.length?`<div class="sec"><h2>Teilnehmende TVs</h2><span class="hint">Cashback · Preis → netto</span></div><div class="card">${tvRows}</div>`:""}
    ${o.bars.length?`<div class="sec"><h2>Teilnehmende Soundbars</h2><span class="hint">aus dem PDF, bei expert zugeordnet</span></div><div class="card">${barRows}</div>`:""}
    ${o.bars.length?renderCalc(o):""}`;
}
function renderCalc(o){
  const tv=o.tvs.find(t=>t.m===C.tv), bar=o.bars.find(b=>b.m===C.bar);
  const setDisc=bar.set&&bar.set.tv===tv.m?bar.set.disc:0;
  const s=[
    {k:"tv",t:"Nur der TV",sub:`${eur0(tv.p)} − ${eur0(tv.a)} einfacher Cashback`,parts:{tv:tv.p,bar:0,cash:tv.a,res:0},ok:true},
    {k:"set",t:"TV + Soundbar im selben Warenkorb, Soundbar verkaufen",sub:`${setDisc?`Set-Deal −${eur0(setDisc)} · `:""}doppelter Cashback ${eur0(tv.d)} · Wiederverkauf ${eur0(C.resale)}`,parts:{tv:tv.p,bar:bar.p-setDisc,cash:tv.d,res:C.resale},ok:true},
    {k:"sep",t:"TV und Soundbar in verschiedenen Märkten",sub:o.sameInvoice?"bei dieser Aktion nicht erlaubt (eine Rechnung)":"bester Markt für jedes Gerät",parts:{tv:tv.p,bar:bar.p,cash:tv.d,res:C.resale},ok:!o.sameInvoice},
  ].map(x=>({...x,eff:x.parts.tv+x.parts.bar-x.parts.cash-x.parts.res}));
  const okS=s.filter(x=>x.ok), bestEff=Math.min(...okS.map(x=>x.eff)), maxG=Math.max(...s.map(x=>x.parts.tv+x.parts.bar)), W=420,H=22;
  const bar1=x=>{const sc=v=>v/maxG*W, tw=sc(x.parts.tv), bw=sc(x.parts.bar), cw=sc(x.parts.cash), rw=sc(x.parts.res), ex=sc(x.eff);
    return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" style="opacity:${x.ok?1:.4}"><rect x="0" y="4" width="${tw}" height="14" rx="3" fill="var(--blue)"/><rect x="${tw+2}" y="4" width="${Math.max(0,bw-2)}" height="14" rx="3" fill="var(--blue)" opacity=".45"/><rect x="${ex}" y="4" width="${cw}" height="14" fill="var(--amber)" opacity=".9"/><rect x="${ex+cw}" y="4" width="${rw}" height="14" fill="var(--card-2)" stroke="var(--muted)" stroke-dasharray="3 2"/><line x1="${ex}" x2="${ex}" y1="0" y2="${H}" stroke="var(--fg)" stroke-width="2"/></svg>`};
  const winner=okS.sort((a,b)=>a.eff-b.eff)[0];
  const breakEven=(bar.p-setDisc)-(tv.d-tv.a);
  return `
    <div class="sec"><h2>Wiederverkaufs-Rechner</h2><span class="hint">Beispiel mit echten Set-Preisen</span></div>
    <div class="card calc">
      <div class="line"><div class="l">TV<small>${esc(tv.n)} · ${esc(S[tv.s].n)}${tv.ex?" · echter Preis, vorausgewählt als Beispiel":""}</small></div><div class="v">${eur0(tv.p)}</div></div>
      <div class="line"><div class="l">Soundbar<small>${esc(bar.n)} · ${esc(S[bar.s].n)}${setDisc?` · Set-Deal −${eur0(setDisc)}`:""}</small></div><div class="v">${eur0(bar.p-setDisc)}</div></div>
      <div class="line minus"><div class="l">Cashback<small>doppelt, TV + Soundbar auf einer Rechnung</small></div><div class="v">− ${eur0(tv.d)}</div></div>
      <div class="line minus"><div class="l">Wiederverkauf der Soundbar<small>deine Schätzung · ${Math.round(C.resale/bar.p*100)} % vom Neupreis</small></div><div class="v"><input id="resale" type="number" step="10" value="${C.resale}" aria-label="Erwarteter Wiederverkaufspreis" onchange="C.resale=+this.value;renderOffer('${o.id}')"></div></div>
      <input id="resale-range" type="range" min="0" max="${bar.p}" step="10" value="${C.resale}" aria-label="Wiederverkaufspreis" oninput="C.resale=+this.value;document.getElementById('resale').value=this.value;document.getElementById('eff').textContent=fmtEff(${tv.p},${bar.p-setDisc},${tv.d},this.value)" onchange="renderOffer('${o.id}')">
      <div class="line total"><div class="l">Effektiver TV-Preis<small>TV + Soundbar − Cashback − Wiederverkauf</small></div><div class="v" id="eff">${eur0(s[1].eff)}</div></div>
      <div class="infobox">${I.info}<span>${winner.k==="tv"?`Die Soundbar zu verkaufen lohnt sich hier nicht: Erst ab <b>${eur0(breakEven)}</b> Wiederverkauf schlägt der Weg „Nur der TV“.`:`Günstigster Weg: <b>${esc(winner.t)}</b>, ${eur0(s[0].eff-winner.eff)} unter „Nur der TV“. Ab ${eur0(breakEven)} Wiederverkauf lohnt sich die Soundbar.`}</span></div>
    </div>
    <div class="sec"><h2>Wege im Vergleich</h2><span class="hint">weniger ist besser</span></div>
    <div class="card"><div class="scen">${s.map(x=>`<div class="s"><div class="t">${esc(x.t)}<small>${esc(x.sub)}</small></div><div class="e ${x.ok?(x.eff===bestEff?'best':''):'na'}">${x.ok?eur0(x.eff):"nicht möglich"}</div>${bar1(x)}</div>`).join("")}</div>
      <div class="legend"><span><i style="background:var(--blue)"></i>TV</span><span><i style="background:var(--blue);opacity:.45"></i>Soundbar</span><span><i style="background:var(--amber)"></i>Cashback</span><span><i style="border:1px dashed var(--muted)"></i>Wiederverkauf</span><span><i style="width:2px;height:11px;background:var(--fg);border-radius:0"></i>effektiver Preis</span></div></div>`;
}
function fmtEff(tv,bar,cash,res){return eur0(tv+bar-cash-(+res))}

/* ===== Einstellungen ===== */
function renderSettings(){
  setTop("Einstellungen",null,""); setTabs("einstellungen");
  document.getElementById("screen").innerHTML=`
    <div class="sec"><h2>Standort</h2></div>
    <div class="card"><div class="set"><div class="k">Postleitzahl<small>bestimmt Entfernung und Abhol-Umkreis</small></div><div class="v"><b>${USER.zip}</b> ${esc(USER.place)}</div></div><div class="set"><div class="k">Abhol-Umkreis</div><div class="v"><b>${USER.radius} km</b></div></div></div>
    <div class="sec"><h2>Benachrichtigungen</h2></div>
    <div class="card"><div class="set"><div class="k">Standard für neue Produkte</div><div class="v"><b>bei jeder Senkung</b></div></div><div class="set"><div class="k">Push-Kanal<small>ntfy-App, Thema wird beim Einrichten erzeugt</small></div><div class="v"><a href="#" onclick="toast('Testnachricht gesendet');return false">Test senden</a></div></div><div class="set"><div class="k">Ruhezeiten<small>Version 2</small></div><div class="v">23:00 – 07:00</div></div><div class="set"><div class="k">Cashback-Marken</div><div class="v"><b>Samsung, Sony, LG, Philips</b></div></div></div>
    <div class="sec"><h2>Scanner</h2></div>
    <div class="card"><div class="set"><div class="k">Letzte Scans</div><div class="v small">Preise vor 12 Min. · Sets vor 1 h 40 Min.<br>Cashback vor 3 h 10 Min. · alles ok</div></div><div class="set"><div class="k">Jetzt scannen<small>startet den Lauf auf GitHub</small></div><div class="v"><button class="btn small" onclick="toast('Scan gestartet, dauert etwa 2 Minuten')">Scan starten</button></div></div><div class="set"><div class="k">GitHub-Zugang<small>nur auf diesem Handy gespeichert</small></div><div class="v"><b>verbunden</b></div></div></div>
    <p class="foot">Einstellungen sind im Prototyp nur angedeutet.</p>`;
}

/* ===== Router ===== */
function route(){
  const h=location.hash.replace("#","")||"liste"; window.scrollTo(0,0);
  if(h==="liste") return renderList();
  if(h==="cashback") return renderCashback();
  if(h==="einstellungen") return renderSettings();
  if(h.startsWith("p-")) return P.some(p=>p.wc===h.slice(2))?renderProduct(h.slice(2)):renderList();
  if(h.startsWith("o-")) return O.some(o=>o.id===h.slice(2))?renderOffer(h.slice(2)):renderCashback();
  renderList();
}
window.addEventListener("hashchange",route); route();
</script>
